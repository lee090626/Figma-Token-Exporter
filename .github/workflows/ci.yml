name: CI and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          set +e
          output="$(npm view "figma-token@$version" version --json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$output" | grep -q 'E404\|No match found'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi

  publish:
    needs: [test, release-check]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish with npm trusted publishing
        working-directory: packages/cli
        run: |
          version="$(node -p "require('./package.json').version")"
          set +e
          output="$(npm view "figma-token@$version" version --json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "figma-token@$version is already published."
            exit 0
          elif ! printf '%s\n' "$output" | grep -q 'E404\|No match found'; then
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
          npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes

  # Figma has no publish API: this builds the plugin and attaches it to a GitHub release,
  # then a maintainer clicks "Publish new version" in the Figma desktop app.
  plugin-release:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/plugin/package.json').version")"
          echo "tag=plugin-v$version" >> "$GITHUB_OUTPUT"
          if gh release view "plugin-v$version" > /dev/null 2>&1; then
            echo "plugin-v$version already exists."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile && pnpm build
      - if: steps.version.outputs.release == 'true'
        name: Create plugin release
        working-directory: packages/plugin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip -r "../../$TAG.zip" manifest.json dist/code.global.js src/ui.html
          gh release create "$TAG" "../../$TAG.zip" --target "$GITHUB_SHA" --title "Figma plugin ${TAG#plugin-}" --notes "Figma 데스크톱 앱에서 Plugins → Manage plugins → Figma Token Exporter → Publish new version을 눌러 배포하세요. 버전은 packages/plugin/package.json 기준입니다."
